spring:
  cache:
    type: redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 5
      password:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    url: jdbc:mysql://127.0.0.1:3306/lumen?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&nullCatalogMeansCurrent=true

security:
  encodeKey: thanks,lumencloud
  ignore-clients:
    - test

jasypt:
  encryptor:
    password: lumen
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

sms:
  is-print: false
  config-type: yaml
